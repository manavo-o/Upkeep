[package]
name = "upkeep_core"
version = "0.3.0"
edition = "2021"
description = "C-ABI Rust engine: parallel nucleo fuzzy matcher, fast Cellar/Caskroom + Homebrew API indexer, APFS-accurate parallel app scanner, and Mole ANSI parser"

[lib]
crate-type = ["staticlib", "cdylib"]
name = "upkeep_core"

[dependencies]
nucleo-matcher = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strip-ansi-escapes = "0.2"
rayon = "1.10"
plist = "1.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
