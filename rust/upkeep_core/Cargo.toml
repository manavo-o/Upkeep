[package]
name = "upkeep_core"
version = "0.5.0"
edition = "2021"
description = "C-ABI Rust engine: bounded Rayon pool, contiguous byte-slab Brew catalog with streaming JSON ingestion, zero-nested-Rayon getattrlistbulk APFS scanner, and safe parallel cleaner"

[lib]
crate-type = ["staticlib", "cdylib"]
name = "upkeep_core"

[dependencies]
nucleo-matcher = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strip-ansi-escapes = "0.2"
rayon = "1.10"
plist = "1.7"
memchr = "2.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
