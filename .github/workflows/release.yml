name: Build & Release Upkeep

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Upkeep.app
        run: ./Scripts/build-app.sh

      - name: Package Release Archive
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/Upkeep.app "release/Upkeep-${VERSION}.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Upkeep-app
          path: release/Upkeep-*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/Upkeep-*.zip
