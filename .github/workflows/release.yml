name: Build & Release Upkeep

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Rust arm64 target
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup target add aarch64-apple-darwin || true
          fi

      - name: Build Upkeep.app
        env:
          UPKEEP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.1.2' }}
        run: |
          export UPKEEP_VERSION="${UPKEEP_VERSION#v}"
          ./Scripts/build-app.sh

      - name: Package Release Archive
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.1.2}"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/Upkeep.app "release/Upkeep-${VERSION}.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Upkeep-app
          path: release/Upkeep-*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: release/Upkeep-*.zip
