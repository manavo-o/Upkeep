name: Build & Release Upkeep

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Rust toolchain & arm64 target
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v cargo >/dev/null 2>&1 || { echo "ERROR: cargo not found on runner" >&2; exit 1; }
          if command -v rustup >/dev/null 2>&1; then
            rustup target add aarch64-apple-darwin
          fi

      - name: Run Rust core tests
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd rust/upkeep_core
          cargo test

      - name: Build Upkeep.app
        env:
          UPKEEP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          export UPKEEP_VERSION="${UPKEEP_VERSION#v}"
          ./Scripts/build-app.sh

      - name: Run Swift self-tests
        run: |
          ./.build/release/UpkeepSelfTest

      - name: Package Release Archive
        run: |
          VERSION="v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Upkeep.app/Contents/Info.plist)"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/Upkeep.app "release/Upkeep-${VERSION}.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Upkeep-app
          path: release/Upkeep-*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: release/Upkeep-*.zip
